<!DOCTYPE html>
<html>
<head>
<title>Portfolio</title>
<style>
body{
font-family:Arial;
text-align:center;
margin:0;
padding:20px;
}

.page{
display:none;
}

.active{
display:block;
}

button{
padding:10px 20px;
margin:10px;
}
</style>
</head>

<body>

<div id="page1" class="page active">
<h1>Nancy Divi</h1>
<p>BCA Student | Full Stack Intern</p>
<button onclick="nextPage(2)">Get Started</button>
</div>

<div id="page2" class="page">
<h2>About Me</h2>
<p>I am a BCA student interested in Web Development.</p>
<button onclick="nextPage(3)">Next</button>
</div>

<div id="page3" class="page">
<h2>Skills</h2>
<ul>
<li>HTML</li>
<li>CSS</li>
<li>JavaScript</li>
<li>React</li>
</ul>
<button onclick="nextPage(4)">Next</button>
</div>

<div id="page4" class="page">
<h2>Projects</h2>
<p>Attendance Tracking System</p>
<p>Portfolio Website</p>
<button onclick="nextPage(5)">Next</button>
</div>

<div id="page5" class="page">
<h2>Contact</h2>

<input type="text" id="name" placeholder="Name"><br><br>

<input type="email" id="email" placeholder="Email"><br><br>

<textarea id="message" placeholder="Message"></textarea><br><br>

<button onclick="saveData()">Submit</button>

<button onclick="nextPage(6)">Admin Login</button>
</div>

<div id="page6" class="page">
<h2>Admin Login</h2>

<input type="text" id="user" placeholder="Username"><br><br>

<input type="password" id="pass" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<div id="responses"></div>
</div>

<script>

function nextPage(page){

let pages=document.querySelectorAll(".page");

pages.forEach(p=>p.classList.remove("active"));

document.getElementById("page"+page)
.classList.add("active");

}

function saveData(){

let data={
name:document.getElementById("name").value,
email:document.getElementById("email").value,
message:document.getElementById("message").value
};

let responses=
JSON.parse(localStorage.getItem("responses"))||[];

responses.push(data);

localStorage.setItem(
"responses",
JSON.stringify(responses)
);

alert("Saved Successfully");

}

function login(){

if(
document.getElementById("user").value==="admin"
&&
document.getElementById("pass").value==="admin123"
){

let responses=
JSON.parse(localStorage.getItem("responses"))||[];

let output="<h3>Responses</h3>";

responses.forEach(r=>{
output+=`
<p><b>Name:</b> ${r.name}</p>
<p><b>Email:</b> ${r.email}</p>
<p><b>Message:</b> ${r.message}</p>
<hr>
`;
});

document.getElementById("responses")
.innerHTML=output;

}
else{
alert("Invalid Login");
}

}

</script>

</body>
</html>
